<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBC - Usuario</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #1a1a1a;
            --accent: #7b2cbf;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(45deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            color: white;
            transition: opacity 0.5s ease-in-out;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.3s forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 1.5em;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        button {
            background: linear-gradient(45deg, #ff4444, #cc0000);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 68, 68, 0.3);
        }

        .user-info {
            background: var(--glass);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            animation: slideIn 0.5s ease-out;
        }

        .user-id {
            color: var(--primary);
            word-break: break-all;
            cursor: pointer;
            transition: all 0.3s;
        }

        .user-id:hover {
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .balance-card {
            background: var(--glass);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            animation: cardFloat 3s ease-in-out infinite;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .balance-amount {
            font-size: 2.5em;
            text-align: center;
            margin: 20px 0;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
            animation: balancePulse 2s infinite;
        }

        @keyframes balancePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .transactions {
            background: var(--glass);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }

        .transaction-item {
            padding: 15px;
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.5s ease-out;
        }

        .transaction-positive {
            border-left: 4px solid var(--primary);
        }

        .transaction-negative {
            border-left: 4px solid #ff4444;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .balance-card {
                padding: 20px;
            }
            
            .balance-amount {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">CBC Wallet</div>
            <button onclick="logout()">
                <i class="fas fa-power-off"></i> Cerrar Sesión
            </button>
        </div>

        <div class="user-info">
            <h2>Tus Datos</h2>
            <p>Correo: <span id="userEmail">Cargando...</span></p>
            <p>Tu ID único: <span class="user-id" id="userId" onclick="copyId()">Cargando...</span></p>
        </div>

        <div class="balance-card">
            <h2>Tu Saldo</h2>
            <div class="balance-amount" id="balance">0 CBC</div>
        </div>

        <div class="transactions">
            <h2>Últimas Transacciones</h2>
            <div id="transactionsList"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCEU1qe4M0IA4eq5GNBxHYAIcmT-zmTKh0",
            authDomain: "cbcoficial.firebaseapp.com",
            projectId: "cbcoficial",
            storageBucket: "cbcoficial.firebasestorage.app",
            messagingSenderId: "895657906770",
            appId: "1:895657906770:web:331962cc100c1c9a15c58b",
            measurementId: "G-PNPXPW5XRX"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged(user => {
            if (!user) {
                document.body.style.opacity = '0';
                setTimeout(() => window.location.href = "index.html", 500);
            } else if (user.email === "orelemcc17@gmail.com") {
                window.location.href = "admin.html";
            } else {
                document.body.style.opacity = '1';
                loadUserData(user);
            }
        });

        function loadUserData(user) {
            document.getElementById("userEmail").textContent = user.email;
            document.getElementById("userId").textContent = user.uid;

            db.collection("users").doc(user.uid).onSnapshot(doc => {
                const userData = doc.data();
                
                // Actualizar saldo
                const balanceElement = document.getElementById("balance");
                balanceElement.textContent = `${userData?.balance || 0} CBC`;

                // Actualizar transacciones
                const transactionsList = document.getElementById("transactionsList");
                transactionsList.innerHTML = "";
                
                (userData?.transactions || []).reverse().forEach(transaction => {
                    const transactionElement = document.createElement('div');
                    transactionElement.className = `transaction-item ${
                        transaction.type === "RECARGA" ? "transaction-positive" : "transaction-negative"
                    }`;
                    
                    transactionElement.innerHTML = `
                        <div>
                            <i class="fas fa-${transaction.type === "RECARGA" ? 'arrow-up' : 'arrow-down'}"></i>
                            <span>${transaction.type}</span>
                        </div>
                        <div>
                            ${transaction.type === "RECARGA" ? '+' : '-'}${transaction.amount} CBC
                        </div>
                    `;
                    
                    transactionsList.appendChild(transactionElement);
                });
            });
        }

        function copyId() {
            const userId = document.getElementById("userId").textContent;
            navigator.clipboard.writeText(userId);
            alert("ID copiado al portapapeles!");
        }

        function logout() {
            auth.signOut().then(() => {
                document.body.style.opacity = '0';
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 500);
            });
        }
    </script>
</body>
</html>
